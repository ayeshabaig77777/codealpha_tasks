<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="gallery-container">
        <h1>My Image Gallery</h1>

        <!-- Category Filters -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="city">City</button>
        </div>

        <!-- Image Grid -->
        <div class="gallery-grid">
            <!-- We are using free placeholder images from Unsplash -->
            <div class="gallery-item nature">
                <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=500" alt="Nature 1" data-index="0">
            </div>
            <div class="gallery-item city">
                <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500" alt="City 1" data-index="1">
            </div>
            <div class="gallery-item nature">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Nature 2" data-index="2">
            </div>
            <div class="gallery-item city">
                <img src="https://images.unsplash.com/photo-1449034446853-66c86144b0ad?w=500" alt="City 2" data-index="3">
            </div>
        </div>
    </div>

    <!-- Lightbox Pop-up (Hidden by default) -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <button class="nav-btn prev-btn">&#10094;</button>
        <img class="lightbox-img" src="" alt="Popup view">
        <button class="nav-btn next-btn">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
