<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <!-- Track Details Block -->
        <div class="track-details">
            <div class="track-art" id="art">🎵</div>
            <h2 id="title">Song Title</h2>
            <h3 id="artist">Artist Name</h3>
        </div>

        <!-- Progress Timeline Bar Slider -->
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-duration">0:00</span>
        </div>

        <!-- Master Control Button Array -->
        <div class="controls">
            <button id="prev-btn" class="ctrl-btn">&#10094;&#10094;</button>
            <button id="play-btn" class="ctrl-btn play-master">&#9654;</button>
            <button id="next-btn" class="ctrl-btn">&#10095;&#10095;</button>
        </div>

        <!-- Volume Rocker Control Layout -->
        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
            <span>🔊</span>
        </div>

        <!-- Bonus Feature: Playlist Queue Grid View -->
        <div class="playlist-box">
            <h4>Next up in Queue</h4>
            <ul id="playlist-queue">
                <!-- Javascript will inject list nodes here dynamically -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
